<style>
  :root {
    --accent: #5e17eb;
    --accent-contrast: #ffffff;
    --bg: #f5f5f8;
    --surface: #ffffff;
    --surface-2: #f0f0f5;
    --text: #1c1c24;
    --text-muted: #6b6b7b;
    --border: #e3e3ec;
    --danger: #e5484d;
    --success: #2fb872;
    --radius: 12px;
    --shadow: 0 2px 10px rgba(20, 20, 40, 0.06);
    --transition: 180ms cubic-bezier(.4,0,.2,1);
  }

  [data-theme="dark"] {
    --accent: #5af2a3;
    --accent-contrast: #08120d;
    --bg: #101114;
    --surface: #17181c;
    --surface-2: #1e2024;
    --text: #eef0f2;
    --text-muted: #9a9ca3;
    --border: #2a2c31;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background var(--transition), color var(--transition);
  }

  button, input, select { font-family: inherit; }

  #app { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 24px;
    transition: background var(--transition), border-color var(--transition);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 0 6px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nav-btn {
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    transition: background var(--transition), color var(--transition), transform var(--transition);
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  .theme-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); padding: 0 6px; }

  .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; transition: background var(--transition); }
  .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 2px; top: 2px; background: white; border-radius: 50%; transition: transform var(--transition); }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  /* ---- Content / views ---- */
  .content { flex: 1; padding: 24px 28px; overflow-x: hidden; }
  .view { display: none; animation: fadeIn 220ms ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  h1.view-title { font-size: 20px; margin: 0 0 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  }

  /* ---- Order view ---- */
  .order-layout { display: flex; gap: 20px; align-items: flex-start; }
  .menu-panel { flex: 1; min-width: 0; }
  .order-panel { width: 340px; flex-shrink: 0; position: sticky; top: 24px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 180px; padding: 10px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: border-color var(--transition);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 13px;
    transition: all var(--transition);
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .menu-card {
    padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: default;
  }
  .menu-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(20,20,40,0.1); }
  .menu-card.unavailable { opacity: 0.5; }
  .menu-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
  .menu-card .name { font-weight: 600; font-size: 14px; }
  .menu-card .price { color: var(--accent); font-weight: 700; font-size: 14px; }
  .menu-card .stock { font-size: 11px; color: var(--text-muted); }
  .menu-card .not-available-badge { font-size: 11px; color: var(--danger); font-weight: 600; }

  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .stepper button {
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 15px; line-height: 1;
    transition: background var(--transition), transform 100ms ease;
  }
  .stepper button:active { transform: scale(0.92); }
  .stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
  .stepper .qty { min-width: 20px; text-align: center; font-weight: 600; }

  .order-summary { padding: 18px; }
  .order-id { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .order-lines { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin-bottom: 12px; }
  .order-line {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px;
    animation: slideIn 200ms ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  .order-line .remove-btn { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 16px; }
  .empty-order { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }

  .totals-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--text-muted); }
  .totals-row.total { font-size: 16px; font-weight: 700; color: var(--text); border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }

  .staff-select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); margin-bottom: 10px;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: var(--radius); border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: transform var(--transition), opacity var(--transition), background var(--transition);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); width: 100%; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }

  /* ---- Tables (Sales view) ---- */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th { text-align: left; color: var(--text-muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  table.data-table tr:hover td { background: var(--surface-2); cursor: pointer; }

  /* ---- Dashboard ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { padding: 16px; animation: fadeIn 260ms ease; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }
  .stat-card .value.accent { color: var(--accent); }

  .chart-card { padding: 18px; margin-bottom: 20px; }
  .chart-card h3 { margin: 0 0 14px; font-size: 15px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; }
  .bar-chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bar-chart .bar { width: 60%; background: var(--accent); border-radius: 6px 6px 0 0; transition: height 400ms cubic-bezier(.4,0,.2,1); }
  .bar-chart .bar-label { font-size: 11px; color: var(--text-muted); text-align: center; }

  .top-items-list { display: flex; flex-direction: column; gap: 10px; }
  .top-item-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .top-item-row .name { width: 130px; flex-shrink: 0; }
  .top-item-row .bar-track { flex: 1; background: var(--surface-2); border-radius: 6px; height: 10px; overflow: hidden; }
  .top-item-row .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 500ms cubic-bezier(.4,0,.2,1); }
  .top-item-row .qty { width: 30px; text-align: right; color: var(--text-muted); }

  /* ---- Menu management ---- */
  .menu-manage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .manage-card { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .manage-card img { width: 100%; height: 90px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
  .manage-card .actions { display: flex; gap: 6px; margin-top: 4px; }
  .manage-card .actions .btn { flex: 1; padding: 7px; font-size: 12px; }

  /* ---- Modal ---- */
  .modal-root:empty { display: none; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex;
    align-items: center; justify-content: center; z-index: 50; animation: fadeIn 150ms ease;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius); padding: 22px; width: 420px;
    max-width: 92vw; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow);
    animation: modalIn 180ms cubic-bezier(.4,0,.2,1);
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; color: var(--text-muted); }
  .form-row input, .form-row select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: var(--radius); font-size: 13px; opacity: 0;
    transform: translateY(10px); pointer-events: none; transition: opacity var(--transition), transform var(--transition);
    z-index: 100; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); color: white; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.15); display: flex; align-items: center;
    justify-content: center; z-index: 200; transition: opacity var(--transition);
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--accent); animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    #app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .order-layout { flex-direction: column; }
    .order-panel { width: 100%; position: static; }
  }
</style>
